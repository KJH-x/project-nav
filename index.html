<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KJH-x Projects</title>
  <meta name="description" content="KJH-x 项目导航 — 汇总所有托管在 Cloudflare Pages 上的公开项目">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="screensaver.css">
</head>
<body>
  <a href="#main-content" class="skip-link">跳转到主内容</a>

  <header class="site-header">
    <div class="hero">
      <p class="eyebrow">KJH-x · Projects</p>
      <h1>项目导航</h1>
      <p class="hero__desc">Cloudflare Pages 上托管的所有公开项目索引。每个项目源码均在 <a href="https://github.com/KJH-x" target="_blank" rel="noopener">GitHub @KJH-x</a> 下公开。</p>
    </div>
  </header>

  <main class="app-shell" id="main-content">
    <section class="toolbar" aria-label="工具栏">
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="搜索项目名称、标签、域名…" aria-label="搜索项目" autocomplete="off">
      </div>
      <label for="themeSelect" class="theme-label">
        <span>主题</span>
        <select id="themeSelect">
          <option value="system">跟随系统</option>
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </label>
    </section>

    <section class="filter-chips" id="filterChips" aria-label="按标签筛选">
      <!-- 标签芯片由 JS 渲染 -->
    </section>
    <p id="resultsStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>

    <section class="section-group" id="section-public">
      <button class="section-header" aria-expanded="true" aria-controls="grid-public">
        <span class="section-chevron" aria-hidden="true"></span>
        <span class="section-title">公网访问</span>
        <span class="section-count" id="count-public">0</span>
      </button>
      <div class="section-body" id="body-public">
        <div class="project-grid" id="grid-public"></div>
      </div>
    </section>

    <section class="section-group" id="section-local">
      <button class="section-header section-header--collapsed" aria-expanded="false" aria-controls="grid-local">
        <span class="section-chevron" aria-hidden="true"></span>
        <span class="section-title">内网链接</span>
        <span class="section-count" id="count-local">0</span>
      </button>
      <div class="section-body" id="body-local" hidden>
        <div class="project-grid" id="grid-local"></div>
      </div>
    </section>

    <section class="section-group" id="section-wip">
      <button class="section-header section-header--collapsed" aria-expanded="false" aria-controls="grid-wip">
        <span class="section-chevron" aria-hidden="true"></span>
        <span class="section-title">未完成</span>
        <span class="section-count" id="count-wip">0</span>
      </button>
      <div class="section-body" id="body-wip" hidden>
        <div class="project-grid" id="grid-wip"></div>
      </div>
    </section>

    <section class="empty-state" id="emptyState" hidden>
      <h2>没有匹配的项目</h2>
      <p>尝试调整搜索词或清除筛选条件</p>
      <button class="btn btn--outline" id="clearFiltersBtn">清除全部筛选</button>
    </section>
  </main>

  <footer class="site-footer">
    <p>手动维护 · 纯静态页面 · 部署于 Cloudflare Pages</p>
    <p><a href="https://github.com/KJH-x" target="_blank" rel="noopener">GitHub @KJH-x</a></p>
  </footer>

  <noscript>
    <div style="text-align:center;padding:2rem">
      <p>请启用 JavaScript 以查看完整导航页。</p>
      <p>你也可以直接查看 <a href="/projects.json">projects.json</a> 获取原始项目列表。</p>
    </div>
  </noscript>

  <!-- ===== Screensaver Overlay ===== -->
  <section id="screensaver" class="screensaver" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Project screensaver" tabindex="-1">
    <div class="screensaver__ambient" aria-hidden="true">
      <span class="screensaver__orb screensaver__orb--one"></span>
      <span class="screensaver__orb screensaver__orb--two"></span>
      <span class="screensaver__orb screensaver__orb--three"></span>
    </div>

    <div class="screensaver__panel" role="presentation">
      <p class="screensaver__eyebrow">Project directory</p>

      <time id="screensaver-clock" class="screensaver__clock"></time>
      <p id="screensaver-date" class="screensaver__date"></p>

      <article class="screensaver__card" aria-label="Featured project">
        <p id="screensaver-card-kicker" class="screensaver__card-kicker">Featured project</p>
        <h2 id="screensaver-project-title" class="screensaver__project-title">Loading projects…</h2>
        <p id="screensaver-project-description" class="screensaver__project-description">Waiting for project data.</p>
        <div id="screensaver-project-tags" class="screensaver__tags" aria-label="Project tags"></div>
        <p id="screensaver-project-url" class="screensaver__url"></p>
      </article>

      <p class="screensaver__hint">Move the mouse or press any key to return.</p>
    </div>
  </section>
  <!-- ===== End Screensaver ===== -->

  <script src="screensaver.js"></script>
  <script src="script.js" type="module"></script>
</body>
</html>
